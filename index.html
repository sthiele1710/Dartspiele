<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WG Darts</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WG Darts">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">

    <style>
        body { margin: 0; font-family: sans-serif; background: #121212; color: white; text-align: center; -webkit-tap-highlight-color: transparent; padding-bottom: 20px;}
        
        .tab-nav { display: flex; background: #1f1f1f; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #333; }
        .tab-nav button { flex: 1; padding: 15px; border: none; background: none; color: #888; font-size: 16px; cursor: pointer; font-weight: bold; }
        .tab-nav button.active { color: gold; border-bottom: 3px solid gold; }
        
        .content { padding: 20px; display: none; }
        .content.active { display: block; }
        
        input { width: 80%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; font-size: 16px; text-align: center; }
        
        .menu-btn { 
            display: flex; justify-content: space-between; align-items: center;
            background: #2a2a2a; color: white; text-decoration: none; 
            padding: 20px; margin: 15px auto; border-radius: 12px; 
            border-left: 8px solid gold; font-weight: bold; font-size: 18px;
            transition: transform 0.1s, background 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); cursor: pointer;
        }
        .menu-btn:active { transform: scale(0.98); background: #333; }
        .icon { font-size: 20px; color: #666; }

        .tournament-btn { border-left-color: gold; background: linear-gradient(90deg, #332b00 0%, #2a2a2a 100%); margin-top: 30px; }

        /* NEUE Remote Box mit Enter-Button */
        .remote-box { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 15px; margin: 20px 0; text-align: left; }
        .toggle-label { display: flex; align-items: center; font-weight: bold; color: gold; font-size: 16px; cursor: pointer; }
        .toggle-label input { width: 20px; height: 20px; margin-right: 10px; margin-top: 0; margin-bottom: 0; }
        
        .join-area { display: flex; gap: 10px; margin-top: 10px; }
        .join-area input { margin: 0; flex: 1; text-transform: uppercase; font-weight: bold; letter-spacing: 2px;}
        .join-area button { background: #2e7d32; color: white; border: none; border-radius: 8px; padding: 0 20px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .join-area button:active { background: #1b5e20; }
        
        table { width: 100%; margin-top: 20px; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 5px; border-bottom: 1px solid #333; text-align: center; }
        td:first-child, th:first-child { text-align: left; padding-left: 10px;}
        th { color: gold; }
        .num { font-weight: bold; color: #ddd; }
    </style>
</head>
<body>

    <div class="tab-nav">
        <button id="btn-games" class="active" onclick="showTab('games')">Spiele</button>
        <button id="btn-stats" onclick="showTab('stats')">Bestenliste</button>
    </div>

    <div id="games" class="content active">
        <h1 style="color:gold; margin-top:0;">🎮 Spiele wählen</h1>
        
        <input type="text" id="p1Name" placeholder="Name Spieler 1" oninput="saveNames()">
        <input type="text" id="p2Name" placeholder="Name Spieler 2" oninput="saveNames()">

        <!-- NEU: Verbesserter Remote Bereich -->
        <div class="remote-box">
            <label class="toggle-label">
                <input type="checkbox" id="remoteToggle" onchange="toggleRemoteUI()">
                🌐 Online (Remote) spielen
            </label>
            
            <div id="remoteUI" style="display: none; margin-top: 15px;">
                <div style="background: #222; padding: 15px; border-radius: 8px;">
                    <p style="margin: 0; font-size: 14px; color: #aaa;">Raum beitreten:</p>
                    <div class="join-area">
                        <input type="text" id="joinID" placeholder="CODE (z.B. ABCD)" maxlength="4">
                        <button onclick="joinRoom()">Enter</button>
                    </div>
                    <p id="joinError" style="color: #ff3b3b; font-size: 13px; margin: 10px 0 0 0; display: none; font-weight: bold;">Raum nicht gefunden!</p>
                </div>
                
                <p style="text-align: center; font-size: 14px; color: #888; margin: 15px 0 5px 0;">Oder wähle ein Spiel, um einen Raum zu erstellen:</p>
            </div>
        </div>
        
        <div>
            <div class="menu-btn" onclick="hostGame('x01.html')" style="border-left-color: #00ff00;">
                <span>💯 X01 (501 / 301)</span> <span class="icon">❯</span>
            </div>
            <div class="menu-btn" onclick="hostGame('cricket.html')" style="border-left-color: #d500f9;">
                <span>🦗 Cricket</span> <span class="icon">❯</span>
            </div>
            <div class="menu-btn" onclick="hostGame('domination.html')" style="border-left-color: #ff3b3b;">
                <span>🎯 Domination</span> <span class="icon">❯</span>
            </div>
            <div class="menu-btn" onclick="hostGame('tictactoe.html')" style="border-left-color: #00bfff;">
                <span>❌ Tic Tac Toe</span> <span class="icon">❯</span>
            </div>
            <div class="menu-btn tournament-btn" onclick="hostGame('tournament.html')">
                <span>🏆 Turnier Modus</span> <span class="icon">❯</span>
            </div>
        </div>
    </div>

    <div id="stats" class="content">
        <h1 style="color:gold; margin-top:0;">🏆 All-Time Siege</h1>
        <table>
            <thead><tr><th>Name</th><th>💯</th> <th>🦗</th> <th>🎯</th> <th>❌</th> </tr></thead>
            <tbody id="leaderboard-body"></tbody>
        </table>
        <button onclick="clearStats()" style="margin-top:30px; background:none; border:none; color:#555; font-size:12px; padding: 20px; width:100%;">Statistiken zurücksetzen</button>
    </div>

    <!-- Normales Skript für Tabs und Namen -->
    <script>
        function showTab(tabId) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.getElementById('btn-' + tabId).classList.add('active');
            if(tabId === 'stats') renderLeaderboard();
        }

        function saveNames() {
            localStorage.setItem('dart_p1', document.getElementById('p1Name').value);
            localStorage.setItem('dart_p2', document.getElementById('p2Name').value);
        }

        window.onload = () => {
            if (!localStorage.getItem('dart_p1')) localStorage.setItem('dart_p1', 'Steffen');
            if (!localStorage.getItem('dart_p2')) localStorage.setItem('dart_p2', 'Jakob');
            document.getElementById('p1Name').value = localStorage.getItem('dart_p1');
            document.getElementById('p2Name').value = localStorage.getItem('dart_p2');
        };

        function toggleRemoteUI() {
            const isChecked = document.getElementById('remoteToggle').checked;
            document.getElementById('remoteUI').style.display = isChecked ? 'block' : 'none';
        }

        function renderLeaderboard() {
            const stats = JSON.parse(localStorage.getItem('allTimeStats') || '{}');
            const entries = Object.entries(stats);
            entries.sort((a, b) => {
                const totalA = ((a[1].x01||0) + (a[1].cricket||0) + (a[1].dart||0) + (a[1].ttt||0));
                const totalB = ((b[1].x01||0) + (b[1].cricket||0) + (b[1].dart||0) + (b[1].ttt||0));
                return totalB - totalA;
            });
            document.getElementById('leaderboard-body').innerHTML = entries.map(([name, data]) => {
                return `<tr><td>${name}</td><td class="num">${data.x01||0}</td><td class="num">${data.cricket||0}</td><td class="num">${data.dart||0}</td><td class="num">${data.ttt||0}</td></tr>`;
            }).join('');
        }

        function clearStats() {
            if(confirm("Wirklich alle Statistiken löschen?")) { localStorage.removeItem('allTimeStats'); renderLeaderboard(); }
        }
    </script>

    <!-- Firebase Modul für die Lobby -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4qDkDED5f2QlzxIzgz21qlk4uEQrfxHs",
            authDomain: "wg-darts.firebaseapp.com",
            databaseURL: "https://wg-darts-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "wg-darts",
            storageBucket: "wg-darts.firebasestorage.app",
            messagingSenderId: "750116064641",
            appId: "1:750116064641:web:cc610da60feb3000e62c80"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Hosten eines Spiels (schreibt das gewählte Spiel in die Lobby)
        window.hostGame = function(gameFile) {
            const isRemote = document.getElementById('remoteToggle').checked;
            if (isRemote) {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                let room = '';
                for (let i = 0; i < 4; i++) room += chars.charAt(Math.floor(Math.random() * chars.length));
                
                // Wir speichern kurz in Firebase, welches Spiel dieser Raum spielt
                set(ref(db, 'lobbies/' + room), { game: gameFile }).then(() => {
                    window.location.href = `${gameFile}?room=${room}`;
                });
            } else {
                window.location.href = gameFile; // Ganz normales lokales Spiel
            }
        };

        // Beitreten über den Enter-Button
        window.joinRoom = function() {
            let room = document.getElementById('joinID').value.trim().toUpperCase();
            if (!room) return;
            
            document.getElementById('joinError').style.display = 'none';
            
            // Wir fragen Firebase, welches Spiel in diesem Raum läuft
            get(child(ref(db), `lobbies/${room}`)).then((snapshot) => {
                if (snapshot.exists()) {
                    const gameFile = snapshot.val().game;
                    window.location.href = `${gameFile}?room=${room}`;
                } else {
                    document.getElementById('joinError').style.display = 'block';
                }
            }).catch((error) => {
                console.error(error);
            });
        };
    </script>
</body>
</html>
